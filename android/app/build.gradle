plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'de.reuschlerit.llmbox'
    compileSdk 35

    defaultConfig {
        applicationId "de.reuschlerit.llmbox"
        minSdk 26
        targetSdk 35
        /* Versionsnummer bewusst gleich wie die Desktop-App (llm-box\package.json).
           Bislang stand hier fest 1.0.32 - dadurch war auf dem Gerat nicht erkennbar,
           ob eine neu gebaute APK wirklich installiert ist (gleicher Name trotz aenderungen). */
        versionCode 86
        versionName "1.0.86-android"
    }

    buildTypes {
        debug {
            // Debug-APK: automatisch signiert, sofort installierbar
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Die fertige Web-App liegt bereits fertig bestückt in assets/webapp (siehe build-webapp.bat)
    androidResources {
        noCompress 'js', 'css', 'html', 'svg', 'json'
    }

    lint {
        abortOnError false
    }

    buildFeatures {
        // BuildConfig.DEBUG steuert die Logcat-Lagemeldung (nur im Debug-Build aktiv)
        buildConfig true
    }
}

// Der Arbeitsordner liegt auf einem Netzlaufwerk (Y:). Dort bleiben gelöschte Ordner im
// Lösch-Limbus hängen und blockieren den Standard-Ausgabeordner "build". Deshalb ein eigener Name.
layout.buildDirectory.set(new File(projectDir, 'app_build'))

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // SMB/CIFS (Windows-Freigaben) als Workspace-Speicher, direkt ohne Kopie
    implementation 'com.hierynomus:smbj:0.15.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'
}
